name: monitor-ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: |
          python -m pip install -U pip
          python -m pip install -r requirements.txt
      - name: Compile Python
        run: python -m py_compile monitor/*.py tests/*.py
      - name: Run tests
        run: python -m pytest tests -q
      - name: Validate deploy examples
        run: |
          python -m json.tool deploy/grafana-dashboard.example.json >/dev/null
          python - <<'PY'
          import yaml
          from pathlib import Path
          yaml.safe_load(Path('deploy/prometheus.scrape.example.yml').read_text())
          PY
